<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Finder</title>
    <link rel="stylesheet" href="stylest.css" />
  </head>
  <body>
    <header>
      <h1>TV Show Finder</h1>
      <p>Find your favorite TV shows!</p>
    </header>
    <main>
      <form id="search-form">
        <input
          type="text"
          id="search-input"
          placeholder="Enter TV show name..."
          required
        />
        <button type="submit">Search</button>
      </form>
      <p id="message"></p>

      <section>
        <h2 id="title">Popular Shows</h2>
        <div id="shows" class="grid">
          <article class="card">
            <img src="" alt="Show Image" />
            <div class="card-content">
              <h3 class="show-title">Show Title</h3>
              <p>Desc / Rate</p>
              <button>Favorite</button>
            </div>
          </article>
        </div>
      </section>

      <section>
        <h2 id="title">My Favorites</h2>
        <div id="favorites" class="grid">
          <article class="card">
            <img src="" alt="Show Image" />
            <div class="card-content">
              <h3 class="show-title">Show Title</h3>
              <p>Desc / Rate</p>
              <button>Favorite</button>
            </div>
          </article>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
