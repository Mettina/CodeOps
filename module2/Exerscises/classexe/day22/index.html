<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Birr Watch</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <h1>Birr Watch</h1>
    <form id="convert-form">
      <input id="amount" type="number" value="100" placeholder="Enter amount" />

      <select id="currency"></select>

      <button type="submit">Convert</button>
    </form>

    <p id="result"></p>

    <h2>Watchlist</h2>

    <button id="add-watch" type="button">Add to Watchlist</button>

    <ul id="watchlist"></ul>

    <p id="status"></p>

    <script src="script.js"></script>
  </body>
</html>
