<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persistent Signup Form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="header-actions">
    <!-- Exercise 1: Theme Toggle Button -->
    <button id="theme-toggle" class="btn">Toggle Theme</button>
  </div>

  <!-- Exercise 3: Signup Form Structure -->
  <form id="signup-form">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" autocomplete="off" />
    </div>
    <div class="form-group">
      <label for="phone">Phone</label>
      <input type="text" id="phone" placeholder="09... or +251..." autocomplete="off" />
    </div>
    <button type="submit" class="btn btn-submit">Sign Up</button>
    <!-- Exercise 3: Error Area -->
    <div id="error-area"></div>
  </form>

  <!-- Exercise 6: On-load counter target -->
  <div id="counter-area"></div>

  <script src="script.js"></script>
</body>
</html>
