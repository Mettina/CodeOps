<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Addis Market Shopping List</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main>

        <h1>Addis Market</h1>

        <form id="add-form">

            <label for="name">Item Name</label>
            <input
                type="text"
                id="name"
                placeholder="e.g. Coffee"
            >

            <label for="price">Price (ETB)</label>
            <input
                type="number"
                id="price"
                placeholder="e.g. 250"
            >

            <button type="submit">Add Item</button>

        </form>

        <h2>Shopping List</h2>

        <ul id="list"></ul>

        <h2>
            Total:
            <span id="total">0</span> ETB
        </h2>

    </main>

    <script src="app.js"></script>

</body>

</html>
